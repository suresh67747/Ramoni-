<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>RAMONI Catalogue Manager</title>
<meta name="description" content="RAMONI professional product catalogue management dashboard" />
<style>
:root{--navy:#071a33;--blue:#1769ff;--ink:#142033;--muted:#718096;--line:#e7edf5;--bg:#f5f7fb;--card:#fff;--green:#18a86b;--orange:#f59e0b;--red:#e05252;--shadow:0 8px 28px rgba(20,32,51,.07)}*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;color:var(--ink);background:var(--bg)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.app{display:flex;min-height:100vh}.sidebar{width:250px;background:var(--navy);color:#fff;padding:22px 15px;position:fixed;inset:0 auto 0 0}.brand{display:flex;align-items:center;gap:12px;padding:4px 12px 28px}.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#2780ff,#0c43b8);display:grid;place-items:center;font-weight:900}.brand b{font-size:19px;letter-spacing:.5px}.brand small{display:block;color:#9db0ca;font-size:10px;margin-top:2px}.nav-title{color:#6f86a4;text-transform:uppercase;font-size:10px;font-weight:800;padding:13px 12px 7px;letter-spacing:1px}.nav{display:flex;flex-direction:column;gap:4px}.nav button{background:transparent;color:#b9c7d9;text-align:left;padding:11px 12px;border-radius:10px;display:flex;gap:11px;align-items:center}.nav button:hover,.nav button.active{background:#102b50;color:#fff}.nav .ico{width:20px;text-align:center}.sidebar-bottom{position:absolute;left:15px;right:15px;bottom:18px;background:#0d2748;border:1px solid #1a3b61;padding:13px;border-radius:12px;color:#9fb1c7;font-size:12px}.main{margin-left:250px;flex:1}.top{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:5}.search{width:min(420px,45vw);background:#f6f8fc;border:1px solid var(--line);border-radius:11px;padding:11px 14px;outline:none}.top-right{display:flex;align-items:center;gap:15px}.bell{width:38px;height:38px;background:#f5f7fb;border-radius:10px}.user{display:flex;align-items:center;gap:10px}.avatar{width:38px;height:38px;border-radius:50%;background:#dce8ff;color:#1754c4;display:grid;place-items:center;font-weight:800}.content{padding:30px}.page-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:25px}.eyebrow{color:var(--blue);font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:1px}.page-head h1{margin:5px 0 6px;font-size:28px}.page-head p{margin:0;color:var(--muted)}.primary{background:var(--blue);color:#fff;padding:11px 16px;border-radius:10px;font-weight:700;box-shadow:0 5px 14px rgba(23,105,255,.2)}.secondary{background:#fff;color:var(--ink);border:1px solid var(--line);padding:10px 14px;border-radius:10px;font-weight:700}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px}.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}.stat-top{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;font-weight:700}.stat h2{margin:8px 0 4px;font-size:27px}.delta{font-size:11px;color:var(--green);font-weight:700}.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px}.panel{background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow)}.panel-head{padding:17px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.panel-head h3{margin:0;font-size:15px}.filters{display:flex;gap:8px;padding:14px 18px;border-bottom:1px solid var(--line)}.filters select{padding:9px;border:1px solid var(--line);border-radius:8px;background:#fff}.products{padding:18px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.product{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;transition:.2s}.product:hover{transform:translateY(-2px);box-shadow:0 9px 24px rgba(20,32,51,.08)}.pic{height:180px;background:#f3f6fa;display:grid;place-items:center;position:relative}.pic img{width:100%;height:100%;object-fit:contain}.placeholder{font-size:45px;color:#b9c5d5}.badge{position:absolute;top:10px;left:10px;background:#eaf8f2;color:#15875a;padding:5px 8px;border-radius:6px;font-size:10px;font-weight:800}.product-body{padding:12px}.product-body h4{margin:0 0 5px;font-size:14px}.model{color:var(--muted);font-size:11px}.price{font-weight:800;margin-top:10px}.product-actions{display:flex;gap:7px;margin-top:11px}.product-actions button{flex:1;padding:8px;border-radius:7px;background:#f4f7fb;color:#38506d;font-size:11px;font-weight:700}.details{padding:20px}.detail-image{height:220px;background:#f4f7fb;border-radius:12px;display:grid;place-items:center;margin-bottom:17px}.detail-image img{width:100%;height:100%;object-fit:contain}.details h2{font-size:19px;margin:0 0 4px}.detail-muted{color:var(--muted);font-size:12px}.specs{margin-top:18px;border-top:1px solid var(--line)}.spec{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:12px}.spec span:first-child{color:var(--muted)}.notice{margin-top:15px;background:#f1f6ff;border:1px solid #d9e6ff;padding:12px;border-radius:10px;font-size:11px;color:#38506d}.hidden{display:none}.modal{position:fixed;inset:0;background:rgba(7,26,51,.45);display:none;place-items:center;z-index:20;padding:20px}.modal.show{display:grid}.modal-card{background:#fff;width:min(720px,100%);max-height:90vh;overflow:auto;border-radius:16px;padding:22px}.modal-head{display:flex;justify-content:space-between;align-items:center}.modal-head h2{margin:0}.close{background:#f1f4f8;border-radius:8px;width:34px;height:34px}.form{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:18px}.field.full{grid-column:1/-1}.field label{display:block;font-size:11px;font-weight:800;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;outline:none}.field textarea{min-height:90px;resize:vertical}.form-foot{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.empty{padding:40px;text-align:center;color:var(--muted);grid-column:1/-1}@media(max-width:1100px){.products{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.details{display:none}}@media(max-width:700px){.sidebar{width:70px}.brand div:not(.logo),.nav button span:not(.ico),.nav-title,.sidebar-bottom{display:none}.main{margin-left:70px}.content{padding:18px}.top{padding:0 15px}.search{width:48vw}.products{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar"><div class="brand"><div class="logo">R</div><div><b>RAMONI</b><small>CATALOGUE MANAGER</small></div></div><div class="nav-title">Workspace</div><nav class="nav"><button class="active" data-view="dashboard"><span class="ico">▦</span><span>Dashboard</span></button><button data-view="products"><span class="ico">◫</span><span>Products</span></button><button data-view="categories"><span class="ico">◈</span><span>Categories</span></button><button data-view="brands"><span class="ico">◆</span><span>Brands</span></button><button data-view="prices"><span class="ico">₹</span><span>Price List</span></button><button data-view="catalogue"><span class="ico">▤</span><span>Catalogue Builder</span></button></nav><div class="nav-title">Business</div><nav class="nav"><button data-view="customers"><span class="ico">♙</span><span>Customers</span></button><button data-view="enquiries"><span class="ico">✉</span><span>Enquiries</span></button><button data-view="reports"><span class="ico">◔</span><span>Reports</span></button><button data-view="settings"><span class="ico">⚙</span><span>Settings</span></button></nav><div class="sidebar-bottom">Production foundation<br><b style="color:#fff">RAMONI v1.0</b></div></aside>
<main class="main"><header class="top"><input id="search" class="search" placeholder="Search products, model no., categories..."/><div class="top-right"><button class="bell">🔔</button><div class="user"><div class="avatar">SP</div><div><b style="font-size:12px">Suresh Patel</b><div style="font-size:10px;color:#8795a8">Administrator</div></div></div></div></header>
<section class="content" id="appContent"></section></main></div>
<div class="modal" id="productModal"><div class="modal-card"><div class="modal-head"><h2>Add Product</h2><button class="close" id="closeModal">×</button></div><form class="form" id="productForm"><div class="field"><label>Product Name *</label><input id="fName" required placeholder="e.g. Swan Basin Mixer"/></div><div class="field"><label>Model No. *</label><input id="fModel" required placeholder="e.g. RM-101"/></div><div class="field"><label>Category</label><select id="fCategory"><option>Faucets</option><option>Sanitaryware</option><option>Showers</option><option>Accessories</option><option>Kitchen</option></select></div><div class="field"><label>Brand</label><input id="fBrand" value="RAMONI"/></div><div class="field"><label>Size</label><input id="fSize" placeholder="e.g. 15 mm"/></div><div class="field"><label>Finish</label><input id="fFinish" placeholder="e.g. Chrome"/></div><div class="field"><label>MRP (₹)</label><input id="fPrice" type="number" placeholder="0"/></div><div class="field"><label>Image URL</label><input id="fImage" placeholder="https://..."/></div><div class="field full"><label>Description</label><textarea id="fDesc" placeholder="Product description, features and specifications..."></textarea></div><div class="form-foot field full"><button type="button" class="secondary" id="cancelModal">Cancel</button><button class="primary">Save Product</button></div></form></div></div>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config.js"></script>
<script src="./supabase-client.js"></script>
<script>
const seed=[
 {id:1,name:'Prime Pillar Cock',model:'RM-PC101',category:'Faucets',brand:'RAMONI',size:'15 mm',finish:'Chrome',price:1299,image:'',desc:'Premium brass body pillar cock with smooth operation.'},
 {id:2,name:'Classic Bib Cock',model:'RM-BC204',category:'Faucets',brand:'RAMONI',size:'15 mm',finish:'Chrome',price:899,image:'',desc:'Reliable everyday bib cock with premium finish.'},
 {id:3,name:'Rainfall Shower',model:'RM-SH310',category:'Showers',brand:'RAMONI',size:'200 mm',finish:'Chrome',price:2499,image:'',desc:'Wide rain shower designed for a comfortable bathing experience.'},
 {id:4,name:'Health Faucet',model:'RM-HF115',category:'Accessories',brand:'RAMONI',size:'1.2 m',finish:'Chrome',price:1099,image:'',desc:'Flexible health faucet with durable braided hose.'},
 {id:5,name:'Angle Cock',model:'RM-AC120',category:'Faucets',brand:'RAMONI',size:'15 mm',finish:'Chrome',price:749,image:'',desc:'Compact angle cock for modern bathroom installations.'},
 {id:6,name:'Counter Basin',model:'RM-CB500',category:'Sanitaryware',brand:'RAMONI',size:'500 mm',finish:'White',price:5499,image:'',desc:'Contemporary counter-top basin with clean geometry.'}
];

let products=JSON.parse(localStorage.getItem('ramoni_products')||'null')||seed;
let view='dashboard', selected=products[0], cloudReady=!!window.ramoniSupabase, cloudMessage='';
const content=document.getElementById('appContent');

function saveLocal(){localStorage.setItem('ramoni_products',JSON.stringify(products));}
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function cats(){return [...new Set(products.map(p=>p.category).filter(Boolean))].sort();}
function brands(){return [...new Set(products.map(p=>p.brand).filter(Boolean))].sort();}
function filteredProducts(){
 const q=(document.getElementById('productSearch')?.value||document.getElementById('search')?.value||'').toLowerCase();
 const cat=document.getElementById('catFilter')?.value||'';
 let a=products.filter(p=>(!q||`${p.name} ${p.model||''} ${p.category||''} ${p.brand||''}`.toLowerCase().includes(q))&&(!cat||p.category===cat));
 const sort=document.getElementById('sortFilter')?.value;
 if(sort==='price')a.sort((x,y)=>(y.price||0)-(x.price||0));
 if(sort==='name')a.sort((x,y)=>(x.name||'').localeCompare(y.name||''));
 return a;
}
function productCard(p,check=false){
 return `<article class="product">
 <div class="pic">${p.image?`<img src="${esc(p.image)}" alt="${esc(p.name)}">`:'<div class="placeholder">◇</div>'}<span class="badge">${p.data_complete?'READY':'INCOMPLETE'}</span></div>
 <div class="product-body"><h4>${esc(p.name)}</h4><div class="model">${esc(p.model||'Model pending')} · ${esc(p.category||'Category pending')}</div>
 <div class="price">${p.price?'₹'+Number(p.price).toLocaleString('en-IN'):'Price pending'}</div>
 <div class="product-actions">${check?`<button onclick="toggleCatalogue('${p.id}')">${catalogueSet.has(String(p.id))?'✓ Selected':'＋ Select'}</button>`:''}<button onclick="selectProduct('${p.id}')">View</button><button onclick="editProduct('${p.id}')">Edit</button></div></div></article>`;
}

function details(){
 if(!selected)return '<div class="details"><div class="empty">Select a product</div></div>';
 return `<div class="details"><div class="detail-image">${selected.image?`<img src="${esc(selected.image)}" alt="">`:'<div class="placeholder">◇</div>'}</div>
 <h2>${esc(selected.name)}</h2><div class="detail-muted">${esc(selected.model||'Model pending')} · ${esc(selected.brand||'Brand pending')}</div>
 <div class="specs"><div class="spec"><span>Category</span><b>${esc(selected.category||'—')}</b></div><div class="spec"><span>Size</span><b>${esc(selected.size||'—')}</b></div><div class="spec"><span>Finish</span><b>${esc(selected.finish||'—')}</b></div><div class="spec"><span>MRP</span><b>${selected.price?'₹'+Number(selected.price).toLocaleString('en-IN'):'—'}</b></div></div>
 <div class="notice">${esc(selected.desc||'Complete the remaining product details.')}</div>
 <button class="primary" style="width:100%;margin-top:14px" onclick="setView('catalogue')">Add to Catalogue</button></div>`;
}

function dashboard(){
 const incomplete=products.filter(p=>!p.data_complete).length;
 return `<div class="page-head"><div><div class="eyebrow">RAMONI Catalogue</div><h1>Good afternoon, Suresh</h1><p>Manage products and build your professional catalogue.</p></div><button class="primary" onclick="openModal()">＋ Add Product</button></div>
 <div class="stats"><div class="stat"><div class="stat-top"><span>Total Products</span><span>◫</span></div><h2>${products.length}</h2><span class="delta">Product master</span></div>
 <div class="stat"><div class="stat-top"><span>Categories</span><span>◈</span></div><h2>${cats().length}</h2><span class="delta">Organised</span></div>
 <div class="stat"><div class="stat-top"><span>Brands</span><span>◆</span></div><h2>${brands().length}</h2><span class="delta">Managed</span></div>
 <div class="stat"><div class="stat-top"><span>Incomplete</span><span>!</span></div><h2>${incomplete}</h2><span class="delta">${incomplete?'Details pending':'All ready'}</span></div></div>
 <div class="layout"><div class="panel"><div class="panel-head"><h3>Product Collection</h3><div style="display:flex;gap:8px"><button class="secondary" onclick="importExcel()">⇧ Import Excel</button><button class="secondary" onclick="setView('products')">View all</button></div></div>
 <div class="filters"><select id="catFilter" onchange="render()"><option value="">All categories</option>${cats().map(c=>`<option>${esc(c)}</option>`).join('')}</select><select id="sortFilter" onchange="render()"><option value="new">Latest</option><option value="price">Price: high to low</option><option value="name">Name A-Z</option></select></div>
 <div class="products">${filteredProducts().slice(0,6).map(p=>productCard(p)).join('')||'<div class="empty">No products found.</div>'}</div></div><div class="panel"><div class="panel-head"><h3>Product Details</h3></div>${details()}</div></div>
 <div class="panel" style="margin-top:20px"><div class="panel-head"><h3>Quick Actions</h3></div><div style="padding:18px;display:flex;gap:10px;flex-wrap:wrap">
 <button class="secondary" onclick="importExcel()">📊 Product Name Excel</button><button class="secondary" onclick="setView('catalogue')">📖 Catalogue Preview</button><button class="secondary" onclick="setView('products')">✎ Complete Details</button>
 </div></div>${cloudMessage?`<div class="notice">${esc(cloudMessage)}</div>`:''}`;
}

function productsView(){
 return `<div class="page-head"><div><div class="eyebrow">Product Master</div><h1>Products</h1><p>Add names first, then complete details gradually.</p></div>
 <div style="display:flex;gap:8px"><button class="secondary" onclick="importExcel()">⇧ Bulk Excel</button><button class="primary" onclick="openModal()">＋ Add Product</button></div></div>
 <div class="panel"><div class="filters"><input id="productSearch" class="search" style="width:280px" placeholder="Search products..." oninput="render()"><select id="catFilter" onchange="render()"><option value="">All categories</option>${cats().map(c=>`<option>${esc(c)}</option>`).join('')}</select></div>
 <div class="products">${filteredProducts().map(p=>productCard(p)).join('')||'<div class="empty">No products found.</div>'}</div></div>`;
}

let catalogueSet=new Set(JSON.parse(localStorage.getItem('ramoni_catalogue_selection')||'[]'));
function toggleCatalogue(id){id=String(id);catalogueSet.has(id)?catalogueSet.delete(id):catalogueSet.add(id);localStorage.setItem('ramoni_catalogue_selection',JSON.stringify([...catalogueSet]));render();}
function catalogueView(){
 const selectedProducts=products.filter(p=>catalogueSet.has(String(p.id)));
 return `<div class="page-head"><div><div class="eyebrow">Customer Catalogue</div><h1>Catalogue Builder</h1><p>Select products, arrange your catalogue and print/save it as PDF.</p></div><div style="display:flex;gap:8px"><button class="secondary" onclick="catalogueSet=new Set(products.map(p=>String(p.id)));localStorage.setItem('ramoni_catalogue_selection',JSON.stringify([...catalogueSet]));render()">Select All</button><button class="primary" onclick="printCatalogue()">Generate PDF</button></div></div>
 <div class="panel"><div class="panel-head"><h3>${selectedProducts.length} products selected</h3><button class="secondary" onclick="setView('products')">＋ Add Products</button></div>
 <div class="products">${selectedProducts.length?selectedProducts.map(p=>productCard(p,true)).join(''):'<div class="empty">No products selected. Go to Products and select items for the catalogue.</div>'}</div></div>
 <div id="printArea" class="hidden"></div>`;
}
function generic(title,sub){return `<div class="page-head"><div><div class="eyebrow">RAMONI Workspace</div><h1>${title}</h1><p>${sub}</p></div></div><div class="panel"><div class="empty" style="padding:70px">${title} module is ready for the next production data phase.<br><button class="primary" style="margin-top:16px" onclick="setView('products')">Open Products</button></div></div>`;}

function render(){
 content.innerHTML=view==='dashboard'?dashboard():view==='products'?productsView():view==='catalogue'?catalogueView():view==='categories'?generic('Categories','Organise your catalogue by product families.'):view==='brands'?generic('Brands','Manage brand identity and product ownership.'):view==='prices'?generic('Price List','Manage MRP and selling-price data.'):view==='customers'?generic('Customers','Keep customer and dealer records in one place.'):view==='enquiries'?generic('Enquiries','Track catalogue enquiries and follow-ups.'):view==='reports'?generic('Reports','Review catalogue and product activity.'):generic('Settings','Configure company, catalogue and administrator settings.');
}

function setView(v){view=v;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));render();}
function selectProduct(id){selected=products.find(p=>String(p.id)===String(id))||selected;render();}
function editProduct(id){selected=products.find(p=>String(p.id)===String(id))||selected;openModal(true);}
function openModal(edit=false){
 document.getElementById('productModal').classList.add('show');document.querySelector('.modal-head h2').textContent=edit?'Edit Product':'Add Product';
 const p=edit?selected:null;document.getElementById('fName').value=p?.name||'';document.getElementById('fModel').value=p?.model||'';document.getElementById('fCategory').value=p?.category||'Faucets';document.getElementById('fBrand').value=p?.brand||'RAMONI';document.getElementById('fSize').value=p?.size||'';document.getElementById('fFinish').value=p?.finish||'';document.getElementById('fPrice').value=p?.price||'';document.getElementById('fImage').value=p?.image||'';document.getElementById('fDesc').value=p?.desc||'';
}
function closeModal(){document.getElementById('productModal').classList.remove('show');}
document.getElementById('closeModal').onclick=closeModal;document.getElementById('cancelModal').onclick=closeModal;
document.getElementById('productForm').onsubmit=e=>{e.preventDefault();const data={name:fName.value.trim(),model:fModel.value.trim(),category:fCategory.value,brand:fBrand.value.trim()||'RAMONI',size:fSize.value.trim(),finish:fFinish.value.trim(),price:Number(fPrice.value||0),image:fImage.value.trim(),desc:fDesc.value.trim(),data_complete:Boolean(fName.value&&fModel.value&&fCategory.value&&fBrand.value&&fSize.value&&fFinish.value&&fPrice.value)};if(selected&&document.querySelector('.modal-head h2').textContent==='Edit Product')Object.assign(selected,data);else{selected={id:Date.now(),...data};products.unshift(selected)}saveLocal();closeModal();render();};

function importExcel(){
 let input=document.getElementById('excelInput');if(!input){input=document.createElement('input');input.type='file';input.id='excelInput';input.accept='.xlsx,.xls,.csv';input.style.display='none';document.body.appendChild(input);input.addEventListener('change',handleExcel);}
 input.value='';input.click();
}
function handleExcel(e){
 const file=e.target.files?.[0];if(!file)return;
 const reader=new FileReader();
 reader.onload=ev=>{
  try{
   const wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array'});
   const ws=wb.Sheets[wb.SheetNames[0]], rows=XLSX.utils.sheet_to_json(ws,{defval:''});
   let added=0;
   rows.forEach((r,i)=>{
    const name=String(r['Product Name']||r['Product Name *']||r['Name']||r['product_name']||Object.values(r)[0]||'').trim();if(!name)return;
    const existing=products.find(p=>(p.name||'').toLowerCase()===name.toLowerCase()&&String(p.model||'').toLowerCase()===String(r['Model No.']||r['Model']||'').toLowerCase());
    if(existing)return;
    products.unshift({id:Date.now()+i,name,model:String(r['Model No.']||r['Model']||r['Product Code']||'').trim(),category:String(r['Category']||'').trim(),subcategory:String(r['Sub Category']||'').trim(),brand:String(r['Brand / Make']||r['Brand']||'RAMONI').trim(),size:String(r['Size / Dimensions']||r['Size']||'').trim(),material:String(r['Material']||'').trim(),finish:String(r['Finish']||'').trim(),price:Number(r['Selling Price (₹)']||r['Selling Price']||0)||0,mrp:Number(r['MRP (₹)']||r['MRP']||0)||0,stock:Number(r['Stock Qty']||r['Stock']||0)||0,image:String(r['Main Image']||r['Image']||'').trim(),desc:String(r['Short Description']||r['Detailed Description']||'').trim(),data_complete:false});added++;
   });
   saveLocal();cloudMessage=`${added} product names imported. You can now complete details one by one.`;setView('products');
  }catch(err){alert('Excel import error: '+err.message);}
 };
 reader.readAsArrayBuffer(file);
}
function printCatalogue(){
 const items=products.filter(p=>catalogueSet.has(String(p.id)));if(!items.length){alert('Please select at least one product.');return;}
 const win=window.open('','_blank');if(!win){alert('Please allow pop-ups for RAMONI Catalogue.');return;}
